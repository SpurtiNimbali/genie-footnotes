<script>/* js/99-app.js */
/* Engine: plays beats forward with motion; Back and jumps rebuild state instantly.
   Before/after changes on the same screen play as a wipe. */
(function () {
  const u = FN.u, ui = FN.ui, story = FN.story, C = FN.charts;
  const params = new URLSearchParams(location.search);
  const STATIC = params.has('static');
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = story.beats.length;
  const $ = (q, r = document) => r.querySelector(q);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  let state = story.initial(), cur = 0, epoch = 0, playing = false, instantNow = false, wiping = false;
  let R = {};

  function stateAt(i) {
    const s = story.initial();
    for (let k = 1; k <= i; k++) for (const step of story.beats[k]) if (typeof step === 'function') step(s);
    s.chapter = null;
    return s;
  }

  /* Footnotes on, for the current screen, after the before/after toggle */
  function fnOn(s) {
    const raw = s.scene === 'dash' ? s.dash.fn : s.scene === 'chat' ? (s.chat.msgs.some(m => m.type === 'top5') ? s.top.fn : s.fn) : false;
    return raw && s.cmp !== 'before';
  }
  function canCompare(s) {
    if (s.scene === 'end') return false;
    return s.scene === 'dash' ? s.dash.fn : s.chat.msgs.some(m => m.type === 'top5') || s.fn;
  }

  /* ---------- Navigation ---------- */
  function jump(i) {
    epoch++; playing = false;
    cur = Math.max(0, Math.min(N - 1, i));
    state = stateAt(cur);
    renderInstant(); walk();
  }
  async function forward() {
    if (cur >= N - 1) return;
    if (playing || state.cmp === 'before') { state = stateAt(cur); renderInstant(); }
    const my = ++epoch;
    cur++; walk();
    if (STATIC || reduced()) { state = stateAt(cur); renderInstant(); walk(); return; }
    playing = true;
    for (const step of story.beats[cur]) {
      if (my !== epoch) return;
      if (typeof step === 'number') await sleep(step);
      else { step(state); render(); }
    }
    if (my === epoch) { playing = false; walk(); }
  }
  function compare(v) {
    if (!canCompare(state) || state.cmp === v || playing) return;
    state.cmp = v; render(); walk();
  }
  function walk() {
    document.querySelectorAll('.tl-dot').forEach(d => {
      const b = +d.dataset.go;
      d.classList.toggle('done', b < cur); d.classList.toggle('cur', b === cur);
      if (b === cur) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current');
    });
    story.chapters.forEach(c => $(`[data-ch="${c.id}"]`).classList.toggle('on', c.beats.includes(cur)));
    $('[data-walk="prev"]').disabled = cur === 0;
    $('[data-walk="next"]').disabled = cur === N - 1;
    const ba = $('[data-ba]');
    ba.hidden = !canCompare(state);
    ba.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cmp === state.cmp)));
    if (!STATIC) history.replaceState(null, '', '#' + cur);
  }

  /* ---------- Rendering ---------- */
  function renderInstant() {
    instantNow = true; C.setInstant(true);
    document.body.classList.add('no-anim');
    render();
    if (STATIC) return;
    requestAnimationFrame(() => requestAnimationFrame(() => { document.body.classList.remove('no-anim'); instantNow = false; C.setInstant(false); }));
  }
  function slot(name, html) {
    const el = $(`[data-slot="${name}"]`);
    if (el && el.__h !== html) { el.innerHTML = html; el.__h = html; }
  }

  function snapshot() {
    const sc = $('#stage > .scene'); if (!sc) return null;
    const th0 = sc.querySelector('.thread'), top0 = th0 ? th0.scrollTop : 0;
    const cl = sc.cloneNode(true);
    cl.__top = top0;
    const a = sc.querySelectorAll('canvas'), b = cl.querySelectorAll('canvas');
    a.forEach((c, k) => { try { b[k].getContext('2d').drawImage(c, 0, 0); } catch (e) { /* noop */ } });
    cl.querySelectorAll('*').forEach(e => { [...e.attributes].forEach(at => { if (at.name === 'id' || at.name.startsWith('data-')) e.removeAttribute(at.name); }); });
    cl.classList.remove('enter-scene'); cl.classList.add('wipe-old');
    return cl;
  }
  function wipe(cl) {
    const stage = $('#stage');
    const line = document.createElement('div'); line.className = 'wipe-line';
    stage.append(cl, line);
    const th = cl.querySelector('.thread'); if (th) { th.style.scrollBehavior = 'auto'; th.scrollTop = cl.__top || 0; }
    cl.getBoundingClientRect();
    requestAnimationFrame(() => { cl.style.clipPath = 'inset(0 0 0 100%)'; line.style.left = '100%'; line.style.opacity = '0.0'; });
    setTimeout(() => { cl.remove(); line.remove(); }, 1150);
  }

  function render() {
    document.querySelectorAll('[data-nav]').forEach(n => n.classList.toggle('on', n.dataset.nav === state.nav));
    const stage = $('#stage');
    const mode = state.scene + ':' + (fnOn(state) ? 1 : 0);
    let snap = null, snapAfter = false;
    if (R.scene !== state.scene) {
      const html = state.scene === 'chat' ? ui.chat() : state.scene === 'dash' ? ui.dash() : ui.end();
      [...stage.children].forEach(c => { if (!c.classList.contains('wipe-old') && !c.classList.contains('wipe-line')) c.remove(); });
      stage.insertAdjacentHTML('afterbegin', html + '<div id="ov"></div>');
      if (!instantNow && stage.firstElementChild) stage.firstElementChild.classList.add('enter-scene');
      R = { scene: state.scene, home: null, draft: '', mode, chapter: R.chapter };
      if (state.chapter) { C.setInstant(true); snapAfter = true; }
    } else if (R.mode !== mode && !instantNow) {
      snap = snapshot();
      C.setInstant(true);
      wiping = true;
    }
    R.mode = mode;
    if (state.scene === 'chat') renderChat();
    if (state.scene === 'dash') renderDash();
    if (snap) { C.setInstant(false); wipe(snap); wiping = false; }
    if (snapAfter && !instantNow) C.setInstant(false);
    renderOverlays();
    if (state.chapter !== R.chapter) { if (state.chapter && !instantNow) showChapter(state.chapter); R.chapter = state.chapter; }
    hint();
    C.prune();
  }

  function renderChat() {
    const body = $('[data-body]');
    if (R.home !== state.chat.home) { body.innerHTML = state.chat.home ? ui.home() : ui.thread(); R.home = state.chat.home; R.draft = ''; }
    if (state.chat.home) {
      if (state.chat.draft !== R.draft) { type($('[data-input]'), state.chat.draft); R.draft = state.chat.draft; }
      return;
    }
    const col = $('[data-col]');
    [...col.children].forEach(el => { if (!state.chat.msgs.some(m => m.key === el.dataset.key)) el.remove(); });
    state.chat.msgs.forEach(m => {
      if (col.querySelector(`[data-key="${m.key}"]`)) return;
      const t = document.createElement('div'); t.innerHTML = ui.msg(m).trim();
      const el = t.firstElementChild; el.dataset.key = m.key;
      if (!instantNow) el.classList.add('enter');
      col.appendChild(el);
    });
    const on = fnOn(state);
    if ($('#c-rv')) {
      const v = on ? state.rv.view : 'weekly';
      slot('rv-say', ui.rvSay(on));
      slot('rv-sub', ui.rvSub(v, on));
      slot('rv-fn', ui.rvNotes(v, on));
      C.set($('#c-rv'), C.weeks(v, on));
    }
    if ($('#c-top')) {
      const t = state.top, def = on ? t.def : 'word';
      slot('t-title', ui.tTitle(def, t.rank, on));
      slot('t-say', ui.tSay(def, t.rank, on));
      slot('t-sub', ui.tSub(def, t.rank, on));
      slot('t-fn', ui.tNotes(def, t.rank, on, t.pop, t.ties));
      C.set($('#c-top'), C.top5(def, t.rank, on));
    }
    if ($('[data-slot="rev-def"]')) {
      slot('rev-say', on ? ui.revSay(state.rev) : `<b>46 franchises</b> have positive reviews.`);
      slot('rev-def', on ? ui.revDef(state.rev) : '');
      slot('rev-fn', on ? ui.revNotes(state.rev) : '');
      count($('[data-count]'), on ? ui.def(state.rev).n : 46);
    }
    const th = $('[data-thread]');
    const fast = instantNow || wiping;
    if (th) {
      if (wiping) setTimeout(() => th.scrollTo({ top: th.scrollHeight, behavior: 'smooth' }), 1050);
      else if (fast) { th.style.scrollBehavior = 'auto'; th.scrollTop = th.scrollHeight; th.style.scrollBehavior = ''; }
      else requestAnimationFrame(() => th.scrollTo({ top: th.scrollHeight, behavior: 'smooth' }));
    }
  }

  function renderDash() {
    const on = fnOn(state), d = state.dash;
    const kv = on ? d.kview : 'weekly', wv = on ? d.wview : 'totals';
    const prevK = R.kv;
    slot('d-meta', ui.dMeta(on));
    slot('k-body', ui.kBody(kv, on));
    slot('k-fn', ui.kNotes(kv, on));
    if (prevK && prevK !== kv && !instantNow && !wiping) {
      const F = FN.DATA.fullDays, LW = FN.DATA.lastWeek;
      const a = prevK === 'full' ? [F.cur, Math.abs(F.pct)] : [LW.cur, Math.abs(LW.pct)];
      const b = kv === 'full' ? [F.cur, Math.abs(F.pct)] : [LW.cur, Math.abs(LW.pct)];
      tween($('[data-kn]'), a[0], b[0], v => u.usd(v));
      tween($('[data-kp]'), a[1], b[1], v => Math.round(v) + '%');
    }
    R.kv = kv;
    slot('w-fn', ui.wNotes(on, wv));
    C.set($('#w-line'), C.weeks(wv === 'perday' ? 'perday' : 'weekly', on, true));
    slot('msg', d.msg && !on ? ui.message() : '');
    const rw = $('[data-slot="w-rev"]');
    const hadRev = rw && rw.__h;
    const wt = $('[data-slot="w-top"]'), hadTop = wt && wt.__h;
    slot('w-top', d.top ? ui.topWidget(on, d.tdef, d.trank, d.tpop, d.ties) : '');
    if (d.top && $('#w-top')) {
      C.set($('#w-top'), C.top5(on ? d.tdef : 'word', d.trank, on));
      const cv = $('.d-canvas');
      if (!hadTop) { if (instantNow || wiping) cv.scrollTop = cv.scrollHeight; else setTimeout(() => cv.scrollTo({ top: cv.scrollHeight, behavior: 'smooth' }), 150); }
      else if (instantNow) cv.scrollTop = cv.scrollHeight;
    }
    requestAnimationFrame(() => C.resize());
    if (rw && d.rev) {
      const sec = rw.firstElementChild;
      if (!hadRev && sec && !instantNow && !wiping) sec.classList.add('enter');
      count($('[data-rcount]'), on ? ui.def({ def: d.rdef }).n : 46);
    }
    const p = $('[data-slot="panel"]');
    if (!d.panel || !on) { p.innerHTML = ''; return; }
    const html = ui.panel(d.panel);
    if (!p.querySelector('.panel')) p.innerHTML = html;
    else {
      const t = document.createElement('div'); t.innerHTML = html;
      const nb = t.querySelector('.panel-b').innerHTML, b = p.querySelector('.panel-b');
      if (b.__h !== nb) { b.innerHTML = nb; b.__h = nb; }
    }
  }

  function renderOverlays() {
    const ov = $('#ov'); if (!ov) return;
    const m = ov.querySelector('.modal');
    if (state.modal && !m) ov.insertAdjacentHTML('beforeend', ui.modal(state.modal));
    if (state.modal && m) { const sw = m.querySelector('[data-switch]'); sw.classList.toggle('on', state.modal.lock); sw.setAttribute('aria-checked', String(state.modal.lock)); }
    if (!state.modal && m) { ov.querySelector('.scrim').remove(); m.remove(); }
    const t = ov.querySelector('.toast');
    if (state.toast && !t) ov.insertAdjacentHTML('beforeend', `<div class="toast" role="status">${FN.icon('checkCircle')}${u.esc(state.toast)}</div>`);
    if (!state.toast && t) t.remove();
  }

  function showChapter(text) {
    const el = document.createElement('div'); el.innerHTML = ui.chapter(text);
    const ch = el.firstElementChild; $('#stage').appendChild(ch);
    setTimeout(() => ch.remove(), 1500);
  }
  function hint() {
    document.querySelectorAll('.hint').forEach(e => e.classList.remove('hint'));
    if (state.hint && !STATIC && state.cmp !== 'before') { const e = $(state.hint); if (e) e.classList.add('hint'); }
  }
  function type(el, text) {
    if (!el) return;
    const up = FN.icon('up');
    if (!text) { el.innerHTML = `<span class="ph">Ask your question…</span>${up}`; return; }
    if (instantNow) { el.innerHTML = `<span class="draft">${u.esc(text)}</span>${up}`; return; }
    const my = epoch; let n = 0;
    (function tick() {
      if (my !== epoch) return;
      n = Math.min(text.length, n + 2);
      el.innerHTML = `<span class="draft">${u.esc(text.slice(0, n))}<span class="caret"></span></span>${up}`;
      if (n < text.length) setTimeout(tick, 16);
    })();
  }
  function tween(el, from, to, fmt) {
    if (!el) return;
    const t0 = performance.now(), dur = 620;
    (function f(t) {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(f);
    })(t0);
  }
  function count(el, to) {
    if (!el) return;
    const from = el.__n == null ? to : el.__n; el.__n = to;
    if (instantNow || from === to) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 520;
    (function f(t) {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(f);
    })(t0);
  }

  /* ---------- Input ---------- */
  function onClick(e) {
    const w = e.target.closest('[data-walk],[data-go],[data-cmp]');
    if (w) {
      if (w.dataset.go) jump(+w.dataset.go);
      else if (w.dataset.cmp) compare(w.dataset.cmp);
      else { const a = w.dataset.walk; if (a === 'next') forward(); else if (a === 'prev') jump(cur - 1); else jump(0); }
      return;
    }
    if (state.hint && state.cmp !== 'before' && e.target.closest(state.hint)) { forward(); return; }
    const t = e.target.closest('[data-fix],[data-kfix],[data-wfix],[data-opt],[data-def],[data-switch],[data-tpop],[data-tdef],[data-trank],[data-treset],[data-ties],[data-tmore]');
    if (!t || playing) return;
    if (t.dataset.fix) state.rv.view = t.dataset.fix === 'undo' || state.rv.view === 'full' ? 'weekly' : 'full';
    else if (t.dataset.kfix) state.dash.kview = t.dataset.kfix === 'undo' || state.dash.kview === 'full' ? 'weekly' : 'full';
    else if (t.dataset.wfix) state.dash.wview = t.dataset.wfix === 'undo' || state.dash.wview === 'perday' ? 'totals' : 'perday';
    else if (t.hasAttribute('data-tpop')) { const o = state.scene === 'dash' ? state.dash : state.top; const k = state.scene === 'dash' ? 'tpop' : 'pop'; o[k] = !o[k]; }
    else if (t.dataset.tdef || t.dataset.trank) {
      const dash = state.scene === 'dash', o = dash ? state.dash : state.top;
      if (t.dataset.tdef) { o[dash ? 'tdef' : 'def'] = t.dataset.tdef; if (t.dataset.tdef === 'word') o[dash ? 'trank' : 'rank'] = 'count'; }
      if (t.dataset.trank) o[dash ? 'trank' : 'rank'] = t.dataset.trank;
      o.ties = false;
    }
    else if (t.hasAttribute('data-treset')) { Object.assign(state.dash, { tdef: 'ai', trank: 'count', tpop: false, ties: false }); }
    else if (t.hasAttribute('data-ties')) { if (state.scene === 'dash') state.dash.ties = !state.dash.ties; else state.top.ties = !state.top.ties; }
    else if (t.hasAttribute('data-tmore')) state.dash.tmore = !state.dash.tmore;
    else if (t.dataset.opt) { state.rev.def = t.dataset.opt; }
    else if (t.dataset.rdef) { state.dash.rdef = t.dataset.rdef; state.dash.rpop = false; }
    else if (t.hasAttribute('data-rpop')) state.dash.rpop = !state.dash.rpop;
    else if (t.hasAttribute('data-rreset')) { state.dash.rdef = 'most'; state.dash.rpop = false; }
    else if (t.hasAttribute('data-def')) state.rev.pop = !state.rev.pop;
    else if (t.hasAttribute('data-switch') && state.modal) state.modal.lock = !state.modal.lock;
    render();
  }
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); forward(); }
    else if (e.key === 'ArrowLeft') jump(cur - 1);
    else if (e.key === 'b' || e.key === 'B') compare(state.cmp === 'before' ? 'after' : 'before');
    else if (e.key === 'r' || e.key === 'R') jump(0);
  }

  function boot() {
    document.body.insertAdjacentHTML('afterbegin', ui.shell(story.beats, story.chapters));
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', () => C.resize());
    const start = parseInt(params.get('beat') || location.hash.slice(1) || '0', 10) || 0;
    jump(start);
    if (params.get('cmp') === 'before') { state.cmp = 'before'; renderInstant(); walk(); }
    if (!STATIC && cur === 0) setTimeout(() => showChapter('Today'), 250);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
